name: Autonomous EV Home Charger & NEC Wire Sizing Engine

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_ev:
        description: 'Optional EV Model (e.g. Porsche Taycan Cross Turismo)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-ev-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build EV Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_EV: ${{ github.event.inputs.custom_ev || '' }}
        run: |
          python engine/ev_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_evs.json
          if git diff --staged --quiet; then
            echo "No new EV charger pages to commit."
          else
            git commit -m "chore(evse): auto-publish new EV charger & NEC wire calculators"
            git push origin main
          fi
